# 项目统一配置文件。
# 本地开发阶段先集中管理 MySQL、Qdrant、Embedding 和日志配置。

app:
  name: AI Data Analysis
  version: 0.1.0
  # 当前尚未接入登录系统，服务端使用这个开发用户标识；正式认证接入后替换来源。
  default_user_id: dev-user

harness:
  # Planner 在同一上下文上遇到可重试失败时允许的重试次数。
  max_planner_retries: 2
  # 仅对幂等工具的临时失败进行自动重试。
  max_tool_retries: 2
  # 单次运行最多执行的工具迭代次数，防止循环无界增长。
  max_iterations: 8
  # 单次运行从开始到终态或暂停的最大时长，单位为秒。
  run_timeout_seconds: 1800
  # query_data 单次调用的最大时长，单位为秒。
  query_timeout_seconds: 300
  # analyze_data 单次调用的最大时长，单位为秒。
  analyze_timeout_seconds: 900
  # build_report 单次调用的最大时长，单位为秒。
  report_timeout_seconds: 600
  # SSE 在没有业务事件时发送注释心跳的间隔，单位为秒。
  sse_heartbeat_seconds: 15

mysql:
  host: 127.0.0.1
  port: 3309
  user: app_user
  password: "123456"
  dw_database: dw
  meta_database: meta
  charset: utf8mb4
  pool_pre_ping: true
  pool_recycle: 3600

postgres:
  # Agent 平台会话历史和 LangGraph Checkpointer 使用 PostgreSQL；分析数据仍在 MySQL。
  host: 127.0.0.1
  port: 5432
  user: ${oc.env:POSTGRES_USER,z523}
  password: ${oc.env:POSTGRES_PASSWORD,""}
  database: agent_app
  pool_pre_ping: true
  pool_recycle: 3600

neo4j:
  # Semantic Memory 的实体关系投影使用 Neo4j；其他记忆类型不写入图数据库。
  uri: ${oc.env:NEO4J_URI,bolt://127.0.0.1:7687}
  user: ${oc.env:NEO4J_USER,neo4j}
  password: ${oc.env:NEO4J_PASSWORD,password}
  database: ${oc.env:NEO4J_DATABASE,neo4j}
  # 控制 Neo4j 驱动连接池大小，避免记忆模块创建过多连接。
  max_connection_pool_size: 50

qdrant:
  url: http://127.0.0.1:6333
  tables_collection: meta_tables_semantic
  columns_collection: meta_columns_semantic
  metrics_collection: meta_metrics_semantic
  dimension_values_collection: meta_dimension_values_semantic
  # 以下 collection 专供记忆模块，避免和业务元数据向量混用。
  memory_episodic_collection: agent_memory_episodic_v1
  memory_semantic_collection: agent_memory_semantic_v1
  memory_perceptual_text_collection: agent_memory_perceptual_text_v1
  memory_perceptual_image_collection: agent_memory_perceptual_image_v1
  memory_perceptual_audio_collection: agent_memory_perceptual_audio_v1
  memory_perceptual_video_collection: agent_memory_perceptual_video_v1
  vector_size: 1024
  distance: Cosine
  upsert_batch_size: 64

elasticsearch:
  url: http://127.0.0.1:9200
  # 应用只访问 alias；重建时先写新的物理索引，再原子切换 alias。
  dimension_values_alias: meta_dimension_values
  dimension_values_index: meta_dimension_values_v1
  bulk_batch_size: 500

dimension_value_search:
  # 第一版只索引文本型维度和明确的枚举维度，月份、评分等走结构化条件。
  included_dimensions:
    - product_category
    - customer_state
    - seller_state
    - order_status
    - payment_type
    - is_delayed
  # 一个关键词从 ES 最多取 20 条文本候选。
  es_top_k_per_term: 20
  # 一个关键词从 Qdrant 最多取 20 条语义候选。
  vector_top_k_per_term: 20
  # 一个关键词完成 ES + Qdrant 融合后最多保留 10 条，不足 10 条不会补齐。
  term_max_k: 10
  # 所有关键词完成全局去重后最多保留 50 条，防止 Agent State 过大。
  total_max_k: 50
  vector_score_threshold: 0.55
  # RRF 排名平滑参数，用排名融合 ES 与 Qdrant 两套不可直接比较的分数。
  rrf_k: 60

metadata_recall:
  # 每类元数据最多使用的召回词数量，避免一次问题产生过多外部请求。
  max_recall_terms: 8
  # 同一类元数据允许并发的召回词数量；过大可能压垮 Embedding/检索服务。
  max_concurrent_terms: 4

embedding:
  # 当前使用阿里云百炼的 OpenAI 兼容 Embedding 接口；切回本地推理服务时改为 provider: local。
  provider: dashscope
  model_name: ${oc.env:DASHSCOPE_EMBEDDING_MODEL,text-embedding-v3}
  dimensions: 1024
  api_key: ${oc.env:DASHSCOPE_API_KEY,""}
  base_url: ${oc.env:DASHSCOPE_BASE_URL,https://dashscope.aliyuncs.com/compatible-mode/v1}
  # 兼容接口单次请求最多 6 条文本。
  batch_size: 6
  # 单次 embedding 调用硬超时；超时后工具直接失败，不做重试。
  timeout_seconds: 30
  # 以下字段仅在 provider: local 时使用。
  host: 127.0.0.1
  port: 8081
  model: BAAI/bge-large-zh-v1.5

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

llm:
  # Agent 只依赖 AutoLLM；切换兼容服务时修改本段配置，不修改业务节点。
  provider: openai-compatible
  # 当前使用阿里云百炼的 OpenAI 兼容接口；API Key 不写入配置文件。
  model_name: ${oc.env:DASHSCOPE_MODEL,qwen3.7-plus}
  api_key: ${oc.env:DASHSCOPE_API_KEY,""}
  base_url: ${oc.env:DASHSCOPE_BASE_URL,https://dashscope.aliyuncs.com/compatible-mode/v1}
  # LLM 响应连续 30 分钟没有返回时超时；流式收到事件后重新计时。
  timeout_seconds: 1800
  # null 和空对象表示采用当前模型服务的默认输出长度与思考参数。
  max_tokens: null
  request_options: {}
  include_usage: true
  stream_only: false

  # 原 SiliconFlow 配置先保留在这里，后续切回时只需取消注释并注释上面的百炼配置。
  # model_name: Pro/zai-org/GLM-5.1
