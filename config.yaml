# 项目统一配置文件。
# 本地开发阶段先集中管理 MySQL、Qdrant、Embedding 和日志配置。

app:
  name: AI Data Analysis
  version: 0.1.0
  # 当前尚未接入登录系统，服务端使用这个开发用户标识；正式认证接入后替换来源。
  default_user_id: dev-user

mysql:
  host: 127.0.0.1
  port: 3309
  user: app_user
  password: "123456"
  dw_database: dw
  meta_database: meta
  # 应用会话、消息和可重渲染结果的独立数据库，不随数据仓库导入重置。
  app_database: agent_app
  charset: utf8mb4
  pool_pre_ping: true
  pool_recycle: 3600

qdrant:
  url: http://127.0.0.1:6333
  tables_collection: meta_tables_semantic
  columns_collection: meta_columns_semantic
  metrics_collection: meta_metrics_semantic
  dimension_values_collection: meta_dimension_values_semantic
  vector_size: 1024
  distance: Cosine
  upsert_batch_size: 64

elasticsearch:
  url: http://127.0.0.1:9200
  # 应用只访问 alias；重建时先写新的物理索引，再原子切换 alias。
  dimension_values_alias: meta_dimension_values
  dimension_values_index: meta_dimension_values_v1
  bulk_batch_size: 500

dimension_value_search:
  # 第一版只索引文本型维度和明确的枚举维度，月份、评分等走结构化条件。
  included_dimensions:
    - product_category
    - customer_state
    - seller_state
    - order_status
    - payment_type
    - is_delayed
  # 一个关键词从 ES 最多取 20 条文本候选。
  es_top_k_per_term: 20
  # 一个关键词从 Qdrant 最多取 20 条语义候选。
  vector_top_k_per_term: 20
  # 一个关键词完成 ES + Qdrant 融合后最多保留 10 条，不足 10 条不会补齐。
  term_max_k: 10
  # 所有关键词完成全局去重后最多保留 50 条，防止 Agent State 过大。
  total_max_k: 50
  vector_score_threshold: 0.55
  # RRF 排名平滑参数，用排名融合 ES 与 Qdrant 两套不可直接比较的分数。
  rrf_k: 60

embedding:
  host: 127.0.0.1
  port: 8081
  model: BAAI/bge-large-zh-v1.5
  # cpu-1.8 在当前 macOS Docker 环境中批量请求可能触发内部队列阻塞。
  batch_size: 1
  retry_count: 3
  retry_backoff_seconds: 2

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

llm:
  # Agent 只依赖 AutoLLM；切换兼容服务时修改本段配置，不修改业务节点。
  provider: openai-compatible
  # 当前使用阿里云百炼的 OpenAI 兼容接口；API Key 不写入配置文件。
  model_name: ${oc.env:DASHSCOPE_MODEL,qwen3.7-plus}
  api_key: ${oc.env:DASHSCOPE_API_KEY,""}
  base_url: ${oc.env:DASHSCOPE_BASE_URL,https://dashscope.aliyuncs.com/compatible-mode/v1}
  # LLM 响应连续 30 分钟没有返回时超时；流式收到事件后重新计时。
  timeout_seconds: 1800
  # null 和空对象表示采用当前模型服务的默认输出长度与思考参数。
  max_tokens: null
  request_options: {}
  include_usage: true
  stream_only: false

  # 原 SiliconFlow 配置先保留在这里，后续切回时只需取消注释并注释上面的百炼配置。
  # model_name: Pro/zai-org/GLM-5.1
  # api_key: ${oc.env:LLM_API_KEY}
  # base_url: https://api.siliconflow.cn/v1
